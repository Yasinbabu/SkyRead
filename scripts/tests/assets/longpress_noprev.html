<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>start</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center;
         background: #123456; font: 32px sans-serif; }
  a { display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: #fff; text-decoration: underline; }
</style>
</head>
<body>
<a id="target" href="https://example.com/longpress-log-target">long-press event log (contextmenu prevented)</a>
<script>
  var t0 = null, evs = [];
  function stamp(name) {
    if (t0 === null) t0 = performance.now();
    evs.push(name + Math.round(performance.now() - t0));
    document.title = evs.join(' ');
  }
  var el = document.getElementById('target');
  ['pointerdown', 'pointerup', 'pointercancel', 'mousedown', 'mouseup',
   'touchstart', 'touchend', 'touchcancel', 'contextmenu'].forEach(function (name, i) {
    var code = ['pd', 'pu', 'pc', 'md', 'mu', 'ts', 'te', 'tc', 'ctx'][i];
    el.addEventListener(name, function () { stamp(code); }, { passive: false });
  });
  el.addEventListener('click', function (e) { e.preventDefault(); stamp('CLICK'); });
  // EXPERIMENT: preventDefault the contextmenu so the renderer does NOT show its native menu
  // and (hypothesis) does NOT enter the "menu shown, awaiting dismiss" input-suppressed state.
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
