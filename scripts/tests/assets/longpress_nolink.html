<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>start</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center;
         background: #123456; font: 32px sans-serif; }
  /* A big NON-link element filling the screen. A long press on a non-link produces a
     TEXT hit type, so Fulguris's longClickPage shows NO dialog. If the stuck-touch state
     still happens here, the dialog is NOT the cause (it's the synthetic touch / renderer
     long-press flow). If it does NOT happen, the custom dialog is the trigger. */
  div { display: flex; align-items: center; justify-content: center;
        width: 100%; height: 100%; color: #fff; }
</style>
</head>
<body>
<div id="target">non-link long-press event log</div>
<script>
  var t0 = null, evs = [];
  function stamp(name) {
    if (t0 === null) t0 = performance.now();
    evs.push(name + Math.round(performance.now() - t0));
    document.title = evs.join(' ');
  }
  var el = document.getElementById('target');
  ['pointerdown', 'pointerup', 'pointercancel', 'mousedown', 'mouseup',
   'touchstart', 'touchend', 'touchcancel', 'contextmenu'].forEach(function (name, i) {
    var code = ['pd', 'pu', 'pc', 'md', 'mu', 'ts', 'te', 'tc', 'ctx'][i];
    el.addEventListener(name, function () { stamp(code); }, { passive: false });
  });
  el.addEventListener('click', function (e) { e.preventDefault(); stamp('CLICK'); });
</script>
</body>
</html>
