<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>start</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center;
         background: #123456; font: 32px sans-serif; }
  /* A single big link filling the screen, so a centered cursor always sits on it (same shape
     as context_target.html). The href is a REAL url so the WebView hit-test returns
     SRC_ANCHOR_TYPE and the long-press dialog appears (a javascript: href would make it
     UNKNOWN_TYPE and longClickPage shows no dialog). click calls preventDefault, so the page
     never navigates away — we keep the page alive to read the full event log. On a real page
     that same click WOULD navigate, which is the reported symptom. */
  a { display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; color: #fff; text-decoration: underline; }
</style>
</head>
<body>
<a id="target" href="https://example.com/longpress-log-target">long-press event log</a>
<script>
  // Log the exact DOM event sequence (and relative timing) that the cursor's synthetic gesture
  // produces. The toolbar label mirrors document.title, so the whole sequence is readable over
  // adb without a screenshot. Compact codes keep the title short enough to survive the label:
  //   pd/pc/pu = pointerdown/pointercancel/pointerup
  //   md/mu    = mousedown/mouseup
  //   ts/te/tc = touchstart/touchend/touchcancel
  //   ctx      = contextmenu   |   CLICK = a real DOM click fired (the stray-navigation culprit)
  var t0 = null, evs = [];
  function stamp(name) {
    if (t0 === null) t0 = performance.now();
    evs.push(name + Math.round(performance.now() - t0));
    document.title = evs.join(' ');
  }
  var el = document.getElementById('target');
  ['pointerdown', 'pointerup', 'pointercancel', 'mousedown', 'mouseup',
   'touchstart', 'touchend', 'touchcancel', 'contextmenu'].forEach(function (name, i) {
    var code = ['pd', 'pu', 'pc', 'md', 'mu', 'ts', 'te', 'tc', 'ctx'][i];
    el.addEventListener(name, function () { stamp(code); }, { passive: false });
  });
  // A genuine click on the anchor. preventDefault keeps the page from navigating so we can read
  // the log; the fact that this fires at all is the signal (on a real link it would navigate).
  el.addEventListener('click', function (e) {
    e.preventDefault();
    stamp('CLICK');
  });
</script>
</body>
</html>
