name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Sherpa-ONNX AAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar

      - name: Download Kokoro TTS Model
        run: |
          mkdir -p app/src/main/assets/kokoro
          curl -L https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_1.tar.bz2 \
            | tar xj -C app/src/main/assets/kokoro --strip-components=1

      - name: Build Debug APK
        run: ./gradlew assembleSlionsFullAgentDebug

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*-debug.apk" -print -quit)
          echo "apk-path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Download APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/**/*-debug.apk
          if-no-files-found: error
